name: Dependency snapshots

on:
  pull_request:
    branches: [dev, main]
    types: [opened, reopened, synchronize, ready_for_review, edited]

permissions:
  contents: read

concurrency:
  group: dependency-snapshots-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  generate:
    name: Resolve Gradle dependencies (${{ matrix.revision }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        revision: [base, head]
    steps:
      - name: Check out exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ matrix.revision == 'base' && github.event.pull_request.base.sha || github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Resolve and save dependency snapshot
        uses: gradle/actions/dependency-submission@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        env:
          GITHUB_DEPENDENCY_GRAPH_SHA: ${{ matrix.revision == 'base' && github.event.pull_request.base.sha || github.event.pull_request.head.sha }}
          GITHUB_DEPENDENCY_GRAPH_REF: ${{ matrix.revision == 'base' && format('refs/heads/{0}', github.event.pull_request.base.ref) || format('refs/pull/{0}/head', github.event.pull_request.number) }}
          GITHUB_DEPENDENCY_GRAPH_JOB_CORRELATOR: notimate-gradle-${{ matrix.revision }}
        with:
          dependency-graph: generate-and-upload
          dependency-graph-report-dir: dependency-graph-reports/${{ matrix.revision }}
          dependency-graph-continue-on-failure: false
          cache-provider: basic
          cache-disabled: true
          artifact-retention-days: 2
          additional-arguments: --no-daemon --no-configuration-cache --stacktrace

      - name: Require generated Maven dependencies
        env:
          SNAPSHOT_DIRECTORY: dependency-graph-reports/${{ matrix.revision }}
        run: |
          node --input-type=module <<'JS'
          import { readdirSync, readFileSync } from 'node:fs';
          const files = readdirSync(process.env.SNAPSHOT_DIRECTORY).filter(file => file.endsWith('.json'));
          if (files.length !== 1) throw new Error('Expected exactly one Gradle snapshot.');
          const snapshot = JSON.parse(readFileSync(`${process.env.SNAPSHOT_DIRECTORY}/${files[0]}`, 'utf8'));
          const dependencies = Object.values(snapshot.manifests ?? {}).flatMap(manifest => Object.values(manifest.resolved ?? {}));
          if (!dependencies.some(dependency => dependency.package_url?.startsWith('pkg:maven/'))) {
            throw new Error('Gradle snapshot has no resolved Maven dependencies.');
          }
          JS
