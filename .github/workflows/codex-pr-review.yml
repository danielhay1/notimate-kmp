name: Codex PR Review

on:
  pull_request_target:
    branches: [dev, main]
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  group: codex-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pending:
    name: Reset head review status
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              ...context.repo, sha: context.payload.pull_request.head.sha,
              context: 'Codex PR review', state: 'pending',
              description: 'Waiting for the current automated review.',
            });

  review:
    name: Review pull request
    needs: pending
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: codex-review
    permissions:
      contents: read
      pull-requests: read
    outputs:
      final_message: ${{ steps.run_codex.outputs.final-message }}

    steps:
      - name: Check out trusted review policy
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare PR data without checking out PR code
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const fs = require('node:fs');
            const pr = context.payload.pull_request;
            const args = { ...context.repo, pull_number: pr.number };
            const assertCurrent = async () => {
              const { data } = await github.rest.pulls.get(args);
              if (data.state !== 'open' || data.head.sha !== pr.head.sha ||
                  data.base.sha !== pr.base.sha) throw new Error('PR changed; rerun review.');
              return data;
            };
            const current = await assertCurrent();
            const files = await github.paginate(github.rest.pulls.listFiles, args);
            if (files.length !== current.changed_files || files.length >= 3000 ||
                files.some(file => !file.patch && !(file.status === 'renamed' && file.changes === 0))) {
              throw new Error('Incomplete PR patch; manual review required.');
            }
            await assertCurrent();
            fs.mkdirSync('.review-input', { recursive: true });
            fs.writeFileSync('.review-input/pr.json', JSON.stringify({
              number: pr.number, head: pr.head.sha, base: pr.base.sha,
              files: files.map(({ filename, previous_filename, status, patch }) =>
                ({ filename, previous_filename, status, patch })),
            }));

      - name: Run repository PR reviewer
        id: run_codex
        uses: openai/codex-action@86365089eb2b84e0a8fb0717b304f8bdcb13b20e # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          codex-version: '0.157.1'
          prompt-file: .github/codex/prompts/pr-review.md
          output-file: codex-review.md
          output-schema-file: .github/codex/schemas/pr-review.schema.json
          sandbox: read-only
          safety-strategy: drop-sudo

  publish:
    name: Publish review verdict
    if: always()
    needs: review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
      statuses: write

    steps:
      - name: Update automated review comment
        id: publish
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          REVIEW_RESULT: ${{ needs.review.outputs.final_message }}
          REVIEW_JOB_RESULT: ${{ needs.review.result }}
        with:
          github-token: ${{ github.token }}
          script: |
            const summaryMarker = "<!-- notimate-codex-pr-review -->";
            const rawReview = (process.env.REVIEW_RESULT || "").trim();
            const jobSucceeded = process.env.REVIEW_JOB_RESULT === "success";
            const pullNumber = context.payload.pull_request.number;
            const headSha = context.payload.pull_request.head.sha;
            const { data: current } = await github.rest.pulls.get({
              ...context.repo, pull_number: pullNumber,
            });
            if (current.state !== "open" || current.head.sha !== headSha ||
                current.base.sha !== context.payload.pull_request.base.sha) {
              throw new Error("PR changed during review; discard stale output.");
            }

            const severity = {
              blocker: { emoji: "🔴", label: "Blocker" },
              should_fix: { emoji: "🟡", label: "Should fix" },
              nit: { emoji: "🟢", label: "Nit" },
            };

            const sanitize = (value) => String(value || "").replaceAll("@", "@\u200b");
            let review;
            let parseError;
            try {
              review = JSON.parse(rawReview);
              const textFields = ['scope_reviewed', 'validation_assessment', 'merge_assessment'];
              if (!review || !['APPROVE', 'APPROVE WITH FOLLOW-UPS', 'REQUEST CHANGES'].includes(review.verdict) ||
                  !textFields.every(key => typeof review[key] === 'string') ||
                  !Array.isArray(review.findings) || !Array.isArray(review.rejected_concerns) ||
                  !review.rejected_concerns.every(value => typeof value === 'string') ||
                  !review.findings.every(finding => finding &&
                    ['severity', 'title', 'body', 'path', 'side'].every(key => typeof finding[key] === 'string'))) {
                throw new Error('Invalid review structure.');
              }
            } catch (error) {
              parseError = error;
              review = undefined;
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullNumber,
              per_page: 100,
            });

            const diffLines = new Map();
            for (const file of files) {
              const sides = { LEFT: new Set(), RIGHT: new Set() };
              let oldLine = 0;
              let newLine = 0;
              for (const patchLine of (file.patch || "").split("\n")) {
                const header = patchLine.match(/^@@ -(\d+)(?:,\d+)? \+(\d+)(?:,\d+)? @@/);
                if (header) {
                  oldLine = Number(header[1]);
                  newLine = Number(header[2]);
                } else if (patchLine.startsWith("+") && !patchLine.startsWith("+++")) {
                  sides.RIGHT.add(newLine++);
                } else if (patchLine.startsWith("-") && !patchLine.startsWith("---")) {
                  sides.LEFT.add(oldLine++);
                } else if (patchLine.startsWith(" ")) {
                  sides.LEFT.add(oldLine++);
                  sides.RIGHT.add(newLine++);
                }
              }
              diffLines.set(file.filename, sides);
            }

            const validFindings = [];
            const invalidFindings = [];
            if (review && Array.isArray(review.findings)) {
              for (const finding of review.findings) {
                const knownSeverity = severity[finding.severity];
                const knownSide = finding.side === "LEFT" || finding.side === "RIGHT";
                const allowedLines = diffLines.get(finding.path)?.[finding.side];
                if (
                  knownSeverity &&
                  knownSide &&
                  Number.isInteger(finding.line) &&
                  allowedLines?.has(finding.line)
                ) {
                  validFindings.push(finding);
                } else {
                  invalidFindings.push(finding);
                }
              }
            }

            const previousInlineComments = await github.paginate(
              github.rest.pulls.listReviewComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pullNumber,
                per_page: 100,
              },
            );

            const inlineComments = validFindings.flatMap((finding) => {
              const meta = severity[finding.severity];
              const key = Buffer.from(
                JSON.stringify([
                  headSha,
                  finding.severity,
                  finding.path,
                  finding.line,
                  finding.side,
                  finding.title,
                ]),
              ).toString("base64url");
              const marker = `<!-- notimate-codex-finding:${key} -->`;
              if (previousInlineComments.some((comment) => comment.body?.includes(marker))) {
                return [];
              }
              return [{
                path: finding.path,
                line: finding.line,
                side: finding.side,
                body: `${marker}\n${meta.emoji} **${meta.label}: ` +
                  `${sanitize(finding.title)}**\n\n${sanitize(finding.body)}`,
              }];
            });

            if (inlineComments.length > 0) {
              await github.rest.pulls.createReview({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pullNumber,
                commit_id: headSha,
                event: "COMMENT",
                body: "Automated Codex findings. Merge authority remains with the user.",
                comments: inlineComments,
              });
            }

            const findingLines = validFindings.length === 0
              ? "None"
              : validFindings.map((finding) => {
                  const meta = severity[finding.severity];
                  return `- ${meta.emoji} **${meta.label}: ${sanitize(finding.title)}** — ` +
                    `\`${finding.path}:${finding.line}\` (${finding.side})`;
                }).join("\n");

            const rejected = Array.isArray(review?.rejected_concerns) &&
              review.rejected_concerns.length > 0
              ? review.rejected_concerns.map((item) => `- ${sanitize(item)}`).join("\n")
              : "None";

            const automationProblems = [];
            if (!jobSucceeded) automationProblems.push("The Codex review job failed.");
            if (parseError) automationProblems.push("The reviewer did not return valid schema JSON.");
            if (invalidFindings.length > 0) {
              automationProblems.push(
                `${invalidFindings.length} finding(s) did not reference a valid PR diff line.`,
              );
            }

            const verdict = review?.verdict || "REQUEST CHANGES";
            const summaryBody = [
              summaryMarker,
              "## Automated Codex PR review",
              "",
              `**Verdict:** ${sanitize(verdict)}`,
              "",
              "### Scope reviewed",
              sanitize(review?.scope_reviewed || "Review did not complete."),
              "",
              "### Findings",
              findingLines,
              "",
              "Every finding above is attached to its referenced diff line.",
              "",
              "### Rejected concerns",
              rejected,
              "",
              "### Validation assessment",
              sanitize(review?.validation_assessment || "Unavailable."),
              "",
              "### Merge assessment",
              sanitize(review?.merge_assessment || "Not ready until the review completes."),
              automationProblems.length > 0
                ? `\n### Automation errors\n${automationProblems.map((item) => `- ${item}`).join("\n")}`
                : "",
            ].join("\n").trim();

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pullNumber,
              per_page: 100,
            });
            const previous = comments.find(
              (comment) => comment.user?.type === "Bot" &&
                comment.body?.includes(summaryMarker),
            );

            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body: summaryBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pullNumber,
                body: summaryBody,
              });
            }

            const acceptedVerdict = ["APPROVE", "APPROVE WITH FOLLOW-UPS"].includes(verdict);
            const hasBlocker = validFindings.some((finding) => finding.severity === "blocker");
            const hasShouldFix = validFindings.some(
              (finding) => finding.severity === "should_fix",
            );
            const inconsistentVerdict =
              (hasBlocker && verdict !== "REQUEST CHANGES") ||
              (hasShouldFix && verdict === "APPROVE");
            if (
              !jobSucceeded ||
              parseError ||
              invalidFindings.length > 0 ||
              inconsistentVerdict ||
              !acceptedVerdict
            ) {
              core.setFailed("The automated PR review did not return an approval verdict.");
            }

      - name: Record result on the reviewed head commit
        if: always()
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          PUBLISH_RESULT: ${{ steps.publish.outcome }}
        with:
          script: |
            const pr = context.payload.pull_request;
            const { data: current } = await github.rest.pulls.get({
              ...context.repo, pull_number: pr.number,
            });
            const fresh = current.state === 'open' && current.head.sha === pr.head.sha &&
              current.base.sha === pr.base.sha;
            await github.rest.repos.createCommitStatus({
              ...context.repo, sha: pr.head.sha,
              context: 'Codex PR review',
              state: fresh && process.env.PUBLISH_RESULT === 'success' ? 'success' : 'failure',
              description: fresh ? 'Automated review completed; see workflow result.' : 'Stale review; rerun required.',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
