name: Codex PR Review

on:
  pull_request:
    branches: [dev, main]
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  group: codex-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Review pull request
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      final_message: ${{ steps.run_codex.outputs.final-message }}

    steps:
      - name: Check out pull request merge result
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0
          persist-credentials: false

      - name: Run repository PR reviewer
        id: run_codex
        uses: openai/codex-action@86365089eb2b84e0a8fb0717b304f8bdcb13b20e # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/codex/prompts/pr-review.md
          output-file: codex-review.md
          sandbox: read-only
          safety-strategy: drop-sudo

  publish:
    name: Publish review verdict
    if: always()
    needs: review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Update automated review comment
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          REVIEW_RESULT: ${{ needs.review.outputs.final_message }}
          REVIEW_JOB_RESULT: ${{ needs.review.result }}
        with:
          github-token: ${{ github.token }}
          script: |
            const marker = "<!-- notimate-codex-pr-review -->";
            const review = (process.env.REVIEW_RESULT || "").trim();
            const completed = process.env.REVIEW_JOB_RESULT === "success" && review.length > 0;
            const body = completed
              ? `${marker}\n## Automated Codex PR review\n\n${review}`
              : `${marker}\n## Automated Codex PR review\n\n` +
                "REQUEST CHANGES\n\nThe automated review did not complete. " +
                "Check the workflow logs and confirm that the `OPENAI_API_KEY` " +
                "Actions secret is configured.";

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const previous = comments.find(
              (comment) => comment.user?.type === "Bot" && comment.body?.includes(marker),
            );

            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body,
              });
            }

            const verdict = review.split(/\r?\n/).find((line) => line.trim())?.trim();
            const acceptedVerdict = ["APPROVE", "APPROVE WITH FOLLOW-UPS"].includes(verdict);
            if (!completed || !acceptedVerdict) {
              core.setFailed("The automated PR review did not return an approval verdict.");
            }
